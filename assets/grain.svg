<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Grain très léger appliqué en fond de la page publique (opacité 0.04, soft-light).
       Ressource LOCALE et générique : le grain était auparavant chargé depuis un site
       extérieur, ce que le chantier Confiance a supprimé (CF-4b, décision D-039).
       Généré par le navigateur — aucune image n'est téléchargée. -->
  <filter id="g">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="200" height="200" filter="url(#g)"/>
</svg>
